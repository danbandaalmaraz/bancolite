spring.application.name=servicio-transferencias
server.port=${PORT:8082}

# cada microservicio tiene su propia base de datos
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bancolite_transferencias?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info

# Pub/Sub apagado por ahora, lo prendemos cuando lleguemos a Google Cloud

spring.cloud.gcp.project-id=${GCP_PROJECT_ID:bancolite-local}
bancolite.pubsub.topic=${PUBSUB_TOPIC:transferencias}
spring.cloud.gcp.sql.enabled=false


# donde vive el servicio de cuentas
bancolite.cuentas.url=${CUENTAS_URL:http://localhost:8081}