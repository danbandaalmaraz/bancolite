# base en memoria solo para pruebas, se crea al arrancar y se borra al terminar
spring.datasource.url=jdbc:h2:mem:bancolite_cuentas;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false